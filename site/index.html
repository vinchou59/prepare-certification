<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prépa certifications</title>
  <meta name="description" content="Quiz d'entraînement gratuit aux certifications agiles : PSM I, PSM II, PSPO I, PSD I, PSK I, PSM-AI et CCA Agile.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apparence choisie (Clair ou Sombre) appliquée avant le premier affichage, pour éviter un flash de l'autre thème
    try { const a = JSON.parse(localStorage.getItem("quiz.appearance")); if (a === "light" || a === "dark") document.documentElement.dataset.theme = a; } catch { /* stockage indisponible : thème du système */ }
  </script>
</head>
<body>
  <main id="app" class="shell" aria-live="polite"></main>
  <noscript><p class="shell">Ce quiz a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
